# Default values for fastapiapp

replicaCount: 3

image:
  repository: sajjadhz/fastapiapp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: "regcred"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

# ⚠️ IMPORTANT : pas de nodePort ici (sinon conflit entre environnements)
service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
