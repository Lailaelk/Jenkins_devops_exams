apiVersion: apps/v1
kind: Deployment

metadata:
  name: movie-service
  labels:
    app: movie-service

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: movie-service

  template:
    metadata:
      labels:
        app: movie-service

    spec:
      containers:
        - name: movie-service

          image: "{{ .Values.movieService.image.repository }}:{{ .Values.movieService.image.tag }}"

          imagePullPolicy: {{ .Values.movieService.image.pullPolicy }}

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URI
              value: "postgresql://movie_db_username:movie_db_password@movie-db/movie_db_dev"

            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
