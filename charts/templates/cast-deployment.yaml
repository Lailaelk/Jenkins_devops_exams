apiVersion: apps/v1
kind: Deployment

metadata:
  name: cast-service
  labels:
    app: cast-service

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: cast-service

  template:
    metadata:
      labels:
        app: cast-service

    spec:
      containers:
        - name: cast-service

          image: "{{ .Values.castService.image.repository }}:{{ .Values.castService.image.tag }}"

          imagePullPolicy: {{ .Values.castService.image.pullPolicy }}

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URI
              value: "postgresql://cast_db_username:cast_db_password@cast_db/cast_db_dev"
