---
# Source: fastapiapp/templates/movie-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: movie-service
  labels:
    app: movie-service

spec:
  selector:
    app: movie-service

  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

  type: ClusterIP
---
# Source: fastapiapp/templates/cast-db.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cast-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cast-db
  template:
    metadata:
      labels:
        app: cast-db
    spec:
      containers:
      - name: postgres
        image: postgres:12.1-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: cast_db_username
        - name: POSTGRES_PASSWORD
          value: cast_db_password
        - name: POSTGRES_DB
          value: cast_db_dev
---
# Source: fastapiapp/templates/cast-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cast-service
  labels:
    app: cast-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cast-service

  template:
    metadata:
      labels:
        app: cast-service

    spec:
      containers:
        - name: cast-service

          image: "lolaelk/cast-service:latest"

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URI
              value: "postgresql://cast_db_username:cast_db_password@cast-db/cast_db_dev"
---
